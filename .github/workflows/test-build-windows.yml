# Test build for this fork: runs the keyframe lane tests, then builds unsigned Windows x64
# binaries (filmcraft.exe + filmcraft-cli.exe) the same way packaging/windows/package.ps1 does,
# and uploads them as an artifact and as a pre-release ("test-build-<sha>"). No signing.
name: Test build (Windows x64)

on:
  workflow_dispatch:
  push:
    branches: [ec-keyframe-zoom, motion-direct-manipulation]

permissions:
  # (write: the build is published as a pre-release, since artifacts need a signed-in download)
  contents: write

concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  FILMCRAFT_BUILD_SHA: ${{ github.sha }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: abb83316d96aa59c1cf64784289e378fe9fa5695
          path: craft-fonts
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: test-build-windows-x64
          cache-on-failure: true
      # (failures are also reported as one annotation, readable through the API without the logs)
      - name: UI tests (keyframe lane, Program monitor)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e +o pipefail
          report() { msg=$(grep -E "^(error|warning: unused)|panicked|assertion|left:|right:|FAILED|^---- |^failures:|test result" -A4 "$1" | head -150 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g'); echo "::error title=$2::$msg"; gh release create "test-log-${GITHUB_SHA::7}-${GITHUB_RUN_ATTEMPT}" "$1" --prerelease --target "$GITHUB_SHA" --title "test log" --notes "failed: $2" -R "$GITHUB_REPOSITORY" || true; }
          cargo test --locked -p filmcraft-edit 2>&1 | tee edit.log; rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then report edit.log "edit tests"; exit $rc; fi
          cargo test --locked -p filmcraft-ui-egui --lib -- effect_controls motion_overlay timeline 2>&1 | tee lib.log; rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then report lib.log "lib tests"; exit $rc; fi
          cargo test --locked -p filmcraft-ui-egui --test keyframe_zoom_ui --test keyframes_ui --test motion_overlay_ui --test keyframe_select_ui --test transitions_ui --test timeline_gap_ui --test deselect_ui --test graphics_ui --test graphics_handles_ui --test masks_ui 2>&1 | tee ui.log; rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then report ui.log "ui tests"; exit $rc; fi
      - name: Build
        shell: bash
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
          FILMCRAFT_REQUIRE_WINRES: "1"
        run: |
          set +e +o pipefail
          cargo build --release --locked -p filmcraft -p filmcraft-cli --target x86_64-pc-windows-msvc 2>&1 | tee build.log; rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then msg=$(grep -E "^error" -A6 build.log | head -150 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g'); echo "::error title=build::$msg"; exit $rc; fi
          mkdir -p dist
          cp target/x86_64-pc-windows-msvc/release/filmcraft.exe target/x86_64-pc-windows-msvc/release/filmcraft-cli.exe dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: filmcraft-windows-x64-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
      - name: Publish as a pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="test-build-${GITHUB_SHA::7}"
          7z a filmcraft-test-windows-x64.zip ./dist/filmcraft.exe ./dist/filmcraft-cli.exe
          gh release create "$tag" filmcraft-test-windows-x64.zip --prerelease --target "$GITHUB_SHA" \
            --title "Test build $tag" --notes "Unsigned test build of ${GITHUB_REF_NAME} (${GITHUB_SHA})." -R "$GITHUB_REPOSITORY"
