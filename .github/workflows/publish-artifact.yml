# Fork-only: republish a finished run's Windows build artifact as a pre-release (when the run's
# own publish step failed after the build succeeded).
name: Publish a build artifact

# (run on a push to the `tools` branch: the run id and tag come from .github/publish-request)
on:
  push:
    branches: [tools]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
      - id: req
        run: |
          echo "run_id=$(sed -n 1p .github/publish-request)" >> "$GITHUB_OUTPUT"
          echo "tag=$(sed -n 2p .github/publish-request)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          run-id: ${{ steps.req.outputs.run_id }}
          github-token: ${{ github.token }}
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          ls -R dist
          cd dist/*/ && zip -q ../../filmcraft-test-windows-x64.zip filmcraft.exe filmcraft-cli.exe filmcraft-plugin-host.exe && cd ../..
          gh release create "${{ steps.req.outputs.tag }}" filmcraft-test-windows-x64.zip --prerelease --title "Test build ${{ steps.req.outputs.tag }}" --notes "Republished from run ${{ steps.req.outputs.run_id }}." -R "$GITHUB_REPOSITORY"
